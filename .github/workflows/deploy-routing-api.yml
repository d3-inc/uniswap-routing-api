name: Deploy Uniswap Routing API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  # Single deploy target
  AWS_REGION: us-east-1

  ENVIRONMENT: mainnet
  API_DOMAIN_NAME: routing-api.doma.xyz
  METRICS_SAMPLE_RATE: '0.05'
  ROUTING_LAMBDA_MEMORY_SIZE: '1024'
  TRACING: 'false'
  QUICKNODE_97476: https://rpc-testnet.doma.xyz
  QUICKNODE_97477: https://rpc.doma.xyz
  # Empty on purpose — matches the values the live stack was deployed with.
  GQL_URL: ''
  GQL_H_ORGN: ''
  TENDERLY_USER: ''
  TENDERLY_PROJECT: ''
  TENDERLY_ACCESS_KEY: ''
  TENDERLY_NODE_API_KEY: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@d3-inc'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ACM certificate for ${{ env.API_DOMAIN_NAME }}
        run: |
          set -euo pipefail
          ARN=$(aws acm list-certificates \
            --region "$AWS_REGION" \
            --certificate-statuses ISSUED \
            --query "CertificateSummaryList[?DomainName=='${API_DOMAIN_NAME}'].CertificateArn | [0]" \
            --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::No ISSUED ACM certificate for ${API_DOMAIN_NAME} in ${AWS_REGION}."
            echo "::error::The API is EDGE-optimized, so the certificate must live in us-east-1."
            exit 1
          fi
          echo "Using certificate $ARN"
          echo "API_CERTIFICATE_ARN=$ARN" >> "$GITHUB_ENV"

      - name: Install CDK CLI
        # Must be >= the aws-cdk-lib version's required CLI. aws-cdk-lib is pinned to 2.230.0
        # (lowest release exposing Runtime.NODEJS_24_X); 2.1128.1 reads its cloud-assembly schema.
        run: npm install -g aws-cdk@2.1128.1

      - name: Deploy CDK stack
        run: cdk deploy RoutingAPIStack --require-approval never --ci

      - name: Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: workflow,job,commit,pullRequest,repo,ref,message,author,took
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                text: `${process.env.AS_WORKFLOW} ${{ job.status }} in ${process.env.AS_TOOK}\n Workflow: ${process.env.AS_JOB} Commit: (${process.env.AS_COMMIT})\n PR: (${process.env.AS_PULL_REQUEST})\n Repo: ${process.env.AS_REPO} Ref: ${process.env.AS_REF}\n Message: ${process.env.AS_MESSAGE}\n By: ${process.env.AS_AUTHOR}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
